name: Deploy literary prototype
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run build -- --base=/moby-dick-explorer/
        if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
      - run: npm run build -- --base=/moby-dick-explorer/preview/issue14/
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
      - uses: actions/checkout@v4
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        with:
          ref: main
          path: production
      - name: Preserve production and add isolated review
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          cd production
          npm ci
          npm run build -- --base=/moby-dick-explorer/
          cd ..
          mv dist candidate-dist
          cp -R production/dist dist
          mkdir -p dist/preview/issue14
          cp -R candidate-dist/. dist/preview/issue14/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
